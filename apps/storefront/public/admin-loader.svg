    <circle cx="58.5" cy="23" r="3.4" opacity=".8"/>
    <circle cx="62" cy="36" r="3.2" opacity=".68"/>
    <circle cx="58.5" cy="49" r="3" opacity=".56"/>
    <circle cx="49" cy="58.5" r="2.8" opacity=".44"/>
    <circle cx="36" cy="62" r="2.6" opacity=".34"/>
    <circle cx="23" cy="58.5" r="2.4" opacity=".26"/>
    <circle cx="13.5" cy="49" r="2.2" opacity=".2"/>
