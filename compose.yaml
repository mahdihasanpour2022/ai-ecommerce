name: automotive-commerce

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: automotive_dev
      POSTGRES_USER: automotive
      POSTGRES_PASSWORD: automotive_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init/01-create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username automotive --dbname automotive_dev']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    shm_size: 128mb

volumes:
  postgres-data:
